<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>
<body>

    <div>
        <h1>Product List</h1>

        <table border="1">
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Product Price</th>
                <th>Product Offer</th>
                <th>Actions</th>
            </tr>

            {% for i in products %}
            <tr>
                <td>{{ i.pid }}</td>
                <td>{{ i.pname }}</td>
                <td>{{ i.pprice }}</td>
                <td>{{ i.poffer }}%</td>
                <td>
                    <a href="{% url 'updateproduct' i.id %}">Update</a>
                    <form action="{% url 'deleteproduct' i.id %}" method="post" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}

        </table>
    </div>

</body>
</html>
