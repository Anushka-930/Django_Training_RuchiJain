<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Registration Portal{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f5f5f5; color: #222; font-family: Arial, sans-serif; }
        a { color: #0645ad; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 5%; background: #fff; border-bottom: 1px solid #ccc; }
        .brand { color: #222; font-weight: bold; text-decoration: none; }
        .brand-mark { display: inline-block; margin-right: 8px; padding: 8px 11px; background: #0645ad; color: #fff; }
        .nav { display: flex; align-items: center; gap: 16px; }
        .nav-cta { padding: 8px 12px; background: #0645ad; color: #fff; text-decoration: none; }
        main { width: 90%; max-width: 1000px; margin: 0 auto; }
        .eyebrow { margin-bottom: 12px; color: #555; font-size: 13px; font-weight: bold; }
        h1, h2 { margin-top: 0; }
        h1 { font-size: 42px; }
        p { line-height: 1.5; }
        .button { display: inline-block; padding: 10px 16px; border: 1px solid #0645ad; background: #0645ad; color: #fff; font-weight: bold; text-decoration: none; cursor: pointer; }
        .button-secondary { background: #fff; color: #0645ad; }
        .panel { padding: 24px; border: 1px solid #ccc; background: #fff; }
        .form-page { padding: 48px 0; }
        .form-panel { width: 100%; max-width: 480px; margin: 0 auto; }
        .form-panel h1 { font-size: 32px; }
        .field { margin: 16px 0; }
        label { display: block; margin-bottom: 6px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #999; font: inherit; }
        .form-panel .button { width: 100%; }
        .form-foot { text-align: center; }
        .error { padding: 10px; border: 1px solid #c00; background: #fff0f0; color: #900; }
        .home-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; padding: 48px 0; }
        .home-copy { max-width: 480px; margin: 20px 0 28px; }
        .home-actions { display: flex; flex-wrap: wrap; gap: 12px; }
        .home-panel { background: #eaf2ff; }
        @media (max-width: 600px) {
            .topbar { gap: 12px; padding: 12px 5%; }
            .nav { gap: 8px; }
            .home-layout { grid-template-columns: 1fr; padding: 32px 0; }
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}"><span class="brand-mark">S</span><span>Student Registration Portal</span></a>
        <nav class="nav" aria-label="Main navigation">
            {% if student_name %}
                <span>{{ student_name }}</span><a class="nav-cta" href="{% url 'logout' %}">Log out</a>
            {% else %}
                <a href="{% url 'login' %}">Log in</a><a class="nav-cta" href="{% url 'signup' %}">Register</a>
            {% endif %}
        </nav>
    </header>
    {% block content %}{% endblock %}
</body>
</html>
