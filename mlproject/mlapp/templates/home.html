<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Type Predictor</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #172033;
            background: linear-gradient(135deg, #e8f3ff, #f8fbff);
        }

        .form-card {
            width: min(720px, 100%);
            padding: 36px;
            border: 1px solid #d7e5f5;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 18px 45px rgba(38, 76, 115, 0.14);
        }

        h1 {
            margin: 0 0 8px;
            color: #143f67;
            font-size: 28px;
        }

        .intro {
            margin: 0 0 28px;
            color: #64758a;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label {
            color: #40566f;
            font-size: 14px;
            font-weight: 700;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #c8d8e8;
            border-radius: 7px;
            color: #172033;
            background: #f8fbfe;
            font-size: 16px;
        }

        input[type="number"]:focus {
            outline: 2px solid #80b5e4;
            border-color: #3982bd;
            background: #ffffff;
        }

        input[type="submit"] {
            grid-column: 1 / -1;
            margin-top: 8px;
            padding: 13px 20px;
            border: 0;
            border-radius: 7px;
            color: #ffffff;
            background: #16745b;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }

        input[type="submit"]:hover {
            background: #105c48;
        }

        @media (max-width: 520px) {
            .form-card {
                padding: 24px;
            }

            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="form-card">
        <h1>Glass Type Predictor</h1>
        <p class="intro">Enter the chemical values to predict the type of glass.</p>

        <form action="{% url 'result' %}">
            {% csrf_token %}
            <div class="field">
                <label for="ri">Refractive index (RI)</label>
                <input id="ri" type="number" step="any" required name="RI">
            </div>
            <div class="field">
                <label for="na">Sodium (Na)</label>
                <input id="na" type="number" step="any" required name="Na">
            </div>
            <div class="field">
                <label for="mg">Magnesium (Mg)</label>
                <input id="mg" type="number" step="any" required name="Mg">
            </div>
            <div class="field">
                <label for="al">Aluminium (Al)</label>
                <input id="al" type="number" step="any" required name="Al">
            </div>
            <div class="field">
                <label for="si">Silicon (Si)</label>
                <input id="si" type="number" step="any" required name="Si">
            </div>
            <div class="field">
                <label for="k">Potassium (K)</label>
                <input id="k" type="number" step="any" required name="K">
            </div>
            <div class="field">
                <label for="ca">Calcium (Ca)</label>
                <input id="ca" type="number" step="any" required name="Ca">
            </div>
            <div class="field">
                <label for="ba">Barium (Ba)</label>
                <input id="ba" type="number" step="any" required name="Ba">
            </div>
            <div class="field">
                <label for="fe">Iron (Fe)</label>
                <input id="fe" type="number" step="any" required name="Fe">
            </div>
            <input type="submit" value="Predict Glass Type">
        </form>
    </main>
</body>
</html>
